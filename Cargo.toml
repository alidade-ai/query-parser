[package]
name = "query-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
  "dyn-symbols",
  "napi9",
  "serde-json",
] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy-query-grammar = "0.25"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = "symbols"
lto = true
